name: Check Sentinel packages

# Public, standard runners check the downloadable binaries. The private
# Sentinel source is built elsewhere and is never checked out by this job.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Draft release tag containing the check bundle (empty checks runner availability)
        required: false
        type: string
      sha256:
        description: SHA-256 of sentinel-checks-windows-x64.zip
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check standard Windows runner
        shell: pwsh
        run: |
          python --version
          Write-Output "Standard Windows runner available for Sentinel package verification."
          python -m unittest discover -s tests -p test_sentinel_check.py
      - name: Download only the compiled check bundle
        if: inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SENTINEL_RELEASE: ${{ inputs.release }}
          SENTINEL_SHA256: ${{ inputs.sha256 }}
        run: |
          if ($env:SENTINEL_RELEASE -cnotmatch '^sentinel-checks-[a-f0-9]{40}$') { throw 'Invalid check release tag' }
          if ($env:SENTINEL_SHA256 -cnotmatch '^[a-f0-9]{64}$') { throw 'A SHA-256 digest is required' }
          gh release download $env:SENTINEL_RELEASE --repo asheux/homebrew-tap --pattern sentinel-checks-windows-x64.zip --dir check-download
          if ($LASTEXITCODE -ne 0) { throw 'Check bundle download failed' }
          $actual = (Get-FileHash check-download/sentinel-checks-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:SENTINEL_SHA256) { throw 'Check bundle checksum mismatch' }
      - name: Verify tests and installer
        if: inputs.release != ''
        shell: pwsh
        env:
          SENTINEL_SHA256: ${{ inputs.sha256 }}
        run: |
          python scripts/check-sentinel.py check-download/sentinel-checks-windows-x64.zip --sha256 $env:SENTINEL_SHA256 --report check-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.release != '' && success()
        with:
          name: sentinel-windows-check-report
          path: check-report.json
          if-no-files-found: error
          retention-days: 1
